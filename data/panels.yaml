  prevalence: 0.02
  notes:
  - These SNPs are associated with HIGHER cognitive ability (positive trait alleles).
  - Intelligence is ~50-80% heritable, with thousands of variants each of tiny effect.
  - Savage et al. 2018 (PMID:29942086, N=269,867) identified 205 GWS loci; Hill et al. 2019 (PMID:30038396, N=248,482) added
    further loci.
  - Giftedness (IQ>130) involves ~2% of population; profound giftedness (IQ>145) ~0.1%.
  - Cognitive ability is strongly influenced by education, environment, nutrition, and socioeconomic factors — genetics is
    not destiny.
