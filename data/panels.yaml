adhd:
  name: Attention Deficit Hyperactivity Disorder (ADHD)
  short_name: ADHD
  prevalence: 0.05
  notes:
  - ADHD heritability is approximately 70-80%.
  - Demontis et al. 2023 (PMID:36702997; 38,691 cases / 186,843 controls) identified 27 genome-wide significant loci; this
    panel uses its index variants.
  - van der Laan et al. 2025 (PMID:40962958) combined ADHD symptom scores with Demontis 2023 (N~299,000) and found 39 loci,
    17 new (e.g. TCF12, CTNNA2, IGF1R); effects are on a symptom scale, so they are not included as ORs.
  - None of the classic dopamine/noradrenaline candidate genes (DRD4, SLC6A3/DAT1, DRD2, COMT, DBH, SLC6A2) appears among
    the GWAS loci; candidate-gene SNPs are weak, mostly unreplicated evidence.
  - ADHD is genetically correlated with ASD (rG 0.43), dyslexia (0.53) and bipolar disorder (0.22), and negatively with intelligence
    (-0.42) (Grotzinger 2026; Doust 2022; Demontis 2023).
  snps:
  - rsid: rs4916723
    gene: LINC00461/MIR9-2
    chromosome: '5'
    risk_allele: C
    odds_ratio: 1.089
    ci_lower: 1.064
