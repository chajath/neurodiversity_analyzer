    odds_ratio: 1.2
    ci_lower: 1.07
    ci_upper: 1.35
    risk_allele_freq: 0.55
    description: Contactin-associated protein-like 2; neural circuit assembly and language development.
    source: PMID:18179900
    unverified: true
    unverified_reason: cited PMID is a different paper (Disruption of neurexin 1 associated with autism spectrum dis...)
  - rsid: rs7794745
