  prevalence: 0.01
  notes:
  - Schizophrenia heritability is approximately 60-80%.
  - Trubetskoy et al. 2022 (PMID:35396580, PGC3) identified 270+ GWS loci in 76,755 cases and 243,649 controls — the largest
    SCZ GWAS to date.
  - The MHC/C4 locus (complement-mediated synaptic pruning) is the strongest signal.
  - DRD2 (dopamine D2 receptor) reached GWS, validating the dopamine hypothesis and confirming antipsychotic drug targets.
  - Substantial genetic overlap with bipolar disorder, ASD, and ADHD.
  - Most schizophrenia risk is from common variants of small effect, but rare CNVs (22q11.2, 1q21.1, 15q13.3) are also major
    risk factors.
