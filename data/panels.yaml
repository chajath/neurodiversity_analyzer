dyslexia:
  name: Dyslexia (Reading Disability)
  short_name: DYSLEXIA
  prevalence: 0.07
  notes:
  - Dyslexia heritability is approximately 40-60%.
  - The largest dyslexia GWAS (Doust et al. 2022, PMID:36266505; 23andMe, 51,800 cases / 1.09M controls) found 42 genome-wide
    significant loci, 27 new. Each common variant raises odds only about 4-7%.
  - None of the classic candidate genes (DCDC2, KIAA0319, DYX1C1, ROBO1) reached genome-wide significance in the large GWAS.
  - Dyslexia shows genetic correlation ~0.53 with ADHD, ~-0.50 with fluid intelligence, and ~0.38 with ambidexterity (Doust
    2022).
  - Reading ability is a continuous trait; dyslexia represents the lower tail of a normal distribution.
