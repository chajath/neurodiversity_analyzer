sps:
  name: Sensory Processing Sensitivity / Overexcitability
  short_name: SPS/OE
  prevalence: 0.2
  notes:
  - Sensory Processing Sensitivity (SPS / HSP) is a TEMPERAMENT TRAIT, not a disorder.
  - This panel now includes BOTH neurochemical markers AND non-pathological trait markers from personality/temperament GWAS
    in healthy populations.
  - 'Trait sources: Neuroticism (Nagel 2018, emotional sensitivity), Empathy (Warrier 2018), Openness (Lo 2017, aesthetic
    sensitivity), Environmental Sensitivity (Assary 2021, direct HSP measure).'
  - 'Relates to Dabrowski''s overexcitabilities: emotional, sensual, intellectual, imaginational.'
  - SPS heritability is estimated at 40-60% (Assary et al. 2021, PMID:33100958).
  - 'SPS is a ''differential susceptibility'' trait: greater sensitivity to BOTH negative AND positive environments (vantage
    sensitivity).'
  - Higher trait allele count = greater depth of processing, NOT pathology.
