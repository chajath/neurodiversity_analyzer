asd:
  name: Autism Spectrum Disorder (ASD)
  short_name: ASD
  prevalence: 0.023
  notes:
  - These SNPs individually have VERY SMALL effect sizes (OR ~1.07-1.27).
  - ASD heritability is 60-90%, involving hundreds to thousands of variants.
  - Grove et al. 2019 (PMID:30804558) identified the first 5 GWS loci (N=18,381/27,969).
  - The most impactful ASD variants are rare CNVs and de novo mutations in CHD8, SCN2A, SHANK3, NRXN1 — NOT detectable from
    23andMe data.
  - Environmental factors and epigenetics also play significant roles.
  snps:
  - rsid: rs2710102
    gene: CNTNAP2
    chromosome: '7'
    risk_allele: C
    odds_ratio: 1.2
    ci_lower: 1.07
