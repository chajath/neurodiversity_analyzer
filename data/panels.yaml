asd:
  name: Autism Spectrum Disorder (ASD)
  short_name: ASD
  prevalence: 0.023
  notes:
  - Common-variant effects are small (OR ~1.05-1.25); ASD heritability is 60-90%, spread across thousands of variants.
  - Grove et al. 2019 (PMID:30804558; 18,381 cases / 27,969 controls) identified the first 5 GWS loci; Matoba et al. 2020
    (PMID:32747698; SPARK + iPSYCH-PGC) confirmed 1p21.3, 8p21 and 20p11 and added 8p11.23 (DDHD2).
  - As of Oct 2026 no larger ASD case-control GWAS has been published; a PGC/iPSYCH freeze with >50,000 cases was presented
    in 2025, and the 2026 cross-disorder study (Grotzinger, PMID:41372416) still uses Grove 2019.
  - Classic candidate-gene SNPs (CNTNAP2, OXTR, RELN, EN2, MET, GABRB3, SLC6A4, COMT, BDNF) are not among the GWAS loci; treat
    them as low-confidence.
  - The most impactful ASD variants are rare CNVs and de novo mutations in CHD8, SCN2A, SHANK3, NRXN1 — NOT detectable from
    23andMe data.
