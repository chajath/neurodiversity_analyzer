tourette:
  name: Tourette Syndrome (TS)
  short_name: TOURETTE
  prevalence: 0.008
  notes:
  - Tourette syndrome heritability is approximately 60-80%.
  - The largest tic-disorder GWAS (TSAICG 2026 preprint, DOI:10.64898/2026.04.09.26350245; 13,247 cases / 536,217 controls)
    found 6 loci, including PCDH9, HCN1 and a 3p21 locus shared with ADHD/OCD (CELSR3/NCKIPSD). Not yet peer reviewed.
  - Yu et al. 2019's top locus (FLT3, rs2504235) did not replicate (P=0.016 in the 2026 meta-analysis); Tsetsos et al. 2024
    (PMID:36738982) added a 5q15 locus near NR2F1.
  - TS genetic risk is enriched in cortico-striato-thalamo-cortical circuits; TS correlates genetically with OCD (rG 0.41)
    and ADHD (0.23).
