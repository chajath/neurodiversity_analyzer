scz:
  name: Schizophrenia (Neurodevelopmental Overlap)
  short_name: SCZ
  prevalence: 0.01
  notes:
  - Schizophrenia heritability is approximately 60-80%.
  - Trubetskoy et al. 2022 (PMID:35396580, PGC3; 76,755 cases / 243,649 controls) reported 287 loci and remains the latest
    European-focused discovery GWAS.
  - 'Multi-ancestry follow-ups: Dang et al. 2025 (PMID:39753749) found 61 new loci; a PGC4 paper has not yet been published.'
  - The extended MHC region is the strongest signal; candidate-gene SNPs (COMT, BDNF, DRD4, MTHFR, DISC1, NRG1, ERBB4) are
    not supported by large GWAS (Johnson et al. 2017, PMID:28823710).
  - Most schizophrenia risk is from common variants of small effect, but rare CNVs (22q11.2, 1q21.1, 15q13.3) are also major
    risk factors.
