gifted:
  name: Cognitive Ability / Giftedness
  short_name: GIFTED
  prevalence: 0.02
  notes:
  - These SNPs are associated with HIGHER cognitive ability (trait-increasing alleles).
  - Intelligence is ~50-80% heritable, with thousands of variants each of tiny effect (<0.05 SD per allele).
  - 'van den Berg et al. 2026 (PMID:42834203; N=455,402, measured + imputed UK Biobank fluid intelligence) found 550 independent
    GWS SNPs — the largest intelligence GWAS to date. Earlier: Savage et al. 2018 (PMID:29942086), Sniekers 2017 (PMID:28530673).'
  - ORs for this quantitative trait are approximate conversions from per-allele SD effects (lnOR = beta*pi/sqrt(3)).
  - Cognitive ability is strongly influenced by education, environment, nutrition, and socioeconomic factors — genetics is
    not destiny.
