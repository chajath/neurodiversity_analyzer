dyslexia:
  name: Dyslexia (Reading Disability)
  short_name: DYSLEXIA
  prevalence: 0.07
  notes:
  - Dyslexia heritability is approximately 40-60%.
  - Strongest associations are on chromosome 6p22 (DCDC2, KIAA0319) — involved in neuronal migration during brain development.
  - Dyslexia frequently co-occurs with ADHD (~30-50% comorbidity) and shares some genetic risk factors.
  - Reading ability is a continuous trait; dyslexia represents the lower tail of a normal distribution.
  snps:
