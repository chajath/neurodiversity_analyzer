bipolar:
  name: Bipolar Disorder
  short_name: BIPOLAR
  prevalence: 0.028
  notes:
  - Bipolar disorder heritability is approximately 60-85%.
  - O'Connell et al. 2025 (PMID:39843750; PGC BD4, 158,036 cases / ~2.8M controls, multi-ancestry) identified 298 genome-wide
    significant loci (229 in Europeans), a 4-fold increase over Mullins 2021; per-locus ORs are mostly 1.03-1.06.
  - Fine-mapping implicates 36 credible genes (e.g. CACNA1C, FURIN, BCL11B); risk is enriched in GABAergic interneurons and
    striatal medium spiny neurons.
  - Earlier candidate-gene and small-GWAS effect sizes (e.g. CACNA1C OR ~1.18) were inflated; PGC4 estimates are ~1.03.
  - Strong genetic overlap with schizophrenia (rG 0.68), plus OCD (0.33) and ADHD (0.22) (Grotzinger 2026).
