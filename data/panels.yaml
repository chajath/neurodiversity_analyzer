ocd:
  name: Obsessive-Compulsive Disorder (OCD)
  short_name: OCD
  prevalence: 0.025
  notes:
  - OCD heritability is approximately 40-65%.
  - Strom et al. 2025 (PMID:40360802; 53,660 cases / 2.04M controls) identified 30 genome-wide significant loci. Per-allele
    ORs are small (~1.04-1.08); ~11,500 variants explain 90% of SNP heritability.
  - OCD risk genes point to hippocampal and cortical excitatory neurons and D1/D2 striatal medium spiny neurons.
  - Classic candidate genes (SLC1A1, HTR2A, SLC6A4, COMT, DLGAP1, BTBD3) were not genome-wide significant in the 2025 PGC-OCD
    GWAS.
  - OCD is genetically correlated with Tourette syndrome (rG 0.41), schizophrenia (0.34), ASD (0.33) and bipolar disorder
    (0.33) (Grotzinger 2026).
