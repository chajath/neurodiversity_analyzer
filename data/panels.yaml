adhd:
  name: Attention Deficit Hyperactivity Disorder (ADHD)
  short_name: ADHD
  prevalence: 0.05
  notes:
  - ADHD heritability is approximately 70-80%.
  - Demontis et al. 2023 (PMID:36702997) is the largest ADHD GWAS (N=225,534) and identified 27 genome-wide significant loci.
  - Dopamine and norepinephrine pathway genes (DAT1, DRD4, DRD2, DBH, NET) are the most-replicated candidate genes for ADHD.
  - ADHD frequently co-occurs with ASD, dyslexia, and mood disorders; many genetic risk factors are shared across conditions.
  - Environmental factors (prenatal exposures, early adversity) interact with genetic risk.
  snps:
  - rsid: rs4916723
